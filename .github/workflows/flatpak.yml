name: Flatpak Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish Flatpak bundle to a GitHub Release"
        required: false
        default: true
        type: boolean
      release_tag:
        description: "Tag name to publish when triggered manually (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"
        type: string

env:
  APPID: io.github.cosmic.AppletUnsplash
  BUNDLE_NAME: io.github.cosmic.AppletUnsplash.flatpak

jobs:
  build-flatpak:
    name: Build Flatpak Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree

      - name: Configure Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak SDK, Runtime, and Rust Extension
        run: |
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Cache Flatpak builder directory
        uses: actions/cache@v6
        with:
          path: |
            .flatpak-builder
          key: flatpak-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flatpak/**') }}
          restore-keys: |
            flatpak-${{ runner.os }}-

      - name: Build Flatpak repository and single-file bundle
        run: |
          flatpak-builder \
            --force-clean \
            --user \
            --disable-rofiles-fuse \
            --repo=repo \
            builddir \
            "flatpak/${APPID}.json"

          flatpak build-bundle \
            repo \
            "${BUNDLE_NAME}" \
            "${APPID}"

          sha256sum "${BUNDLE_NAME}" > "${BUNDLE_NAME}.sha256"
          ls -lh "${BUNDLE_NAME}" "${BUNDLE_NAME}.sha256"

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: |
            ${{ env.BUNDLE_NAME }}
            ${{ env.BUNDLE_NAME }}.sha256
          if-no-files-found: error

      - name: Upload OSTree Flatpak repository artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-ostree-repo
          path: repo/
          if-no-files-found: error

  publish-release:
    name: Publish Flatpak to GitHub Releases
    needs: build-flatpak
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Flatpak bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: flatpak-bundle
          path: dist

      - name: Publish GitHub Release with Flatpak bundle
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'v0.1.0' }}
          generate_release_notes: true
          files: |
            dist/${{ env.BUNDLE_NAME }}
            dist/${{ env.BUNDLE_NAME }}.sha256
