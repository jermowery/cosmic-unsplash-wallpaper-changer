name: Flatpak Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish Flatpak bundle to a GitHub Release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Existing tag to publish when triggered manually (e.g. v0.1.2)"
        required: false
        default: ""
        type: string

env:
  APPID: io.github.jermowery.CosmicExtAppletRandomWallpaper
  BUNDLE_NAME: io.github.jermowery.CosmicExtAppletRandomWallpaper.flatpak

jobs:
  build-flatpak:
    name: Build Flatpak Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree

      - name: Configure Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak SDK, Runtime, and Rust Extension
        run: |
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Cache Flatpak builder directory
        uses: actions/cache@v6
        with:
          path: |
            .flatpak-builder
          key: flatpak-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flatpak/**') }}
          restore-keys: |
            flatpak-${{ runner.os }}-

      - name: Build Flatpak repository and single-file bundle
        run: |
          flatpak-builder \
            --force-clean \
            --user \
            --disable-rofiles-fuse \
            --repo=repo \
            builddir \
            "flatpak/${APPID}.json"

          # --runtime-repo embeds the Flathub remote so `flatpak install <bundle>`
          # can fetch org.freedesktop.Platform on machines without Flathub configured.
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo \
            "${BUNDLE_NAME}" \
            "${APPID}"

          sha256sum "${BUNDLE_NAME}" > "${BUNDLE_NAME}.sha256"
          ls -lh "${BUNDLE_NAME}" "${BUNDLE_NAME}.sha256"

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: |
            ${{ env.BUNDLE_NAME }}
            ${{ env.BUNDLE_NAME }}.sha256
          if-no-files-found: error

      - name: Upload OSTree Flatpak repository artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-ostree-repo
          path: repo/
          if-no-files-found: error

  publish-release:
    name: Publish Flatpak to GitHub Releases
    needs: build-flatpak
    # Only versioned tags (or an explicit manual run naming a tag) publish releases,
    # so pushes to `main` never overwrite assets on an existing release.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Flatpak bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: flatpak-bundle
          path: dist

      - name: Write release install instructions
        run: |
          cat > dist/RELEASE_NOTES.md <<EOF
          ## Install

          \`\`\`bash
          curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${BUNDLE_NAME}
          flatpak install --user ./${BUNDLE_NAME}
          \`\`\`

          Then open **COSMIC Settings → Desktop → Panel → Configure panel applets → Add applet** and choose **Random Wallpaper**.

          You will need your own Unsplash Access Key; see the [README](https://github.com/${GITHUB_REPOSITORY}#getting-an-unsplash-api-key-required).
          EOF
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}

      - name: Publish GitHub Release with Flatpak bundle
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: true
          files: |
            dist/${{ env.BUNDLE_NAME }}
            dist/${{ env.BUNDLE_NAME }}.sha256
