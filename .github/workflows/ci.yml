name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Format, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy lints (zero warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --verbose

  validate-metadata:
    name: Validate Desktop, AppStream & Flatpak Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install desktop and AppStream validators
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream python3

      - name: Validate .desktop entry
        run: |
          desktop-file-validate resources/io.github.jermowery.CosmicExtAppletRandomWallpaper.desktop

      - name: Validate AppStream metainfo XML
        run: |
          appstreamcli validate --no-net resources/io.github.jermowery.CosmicExtAppletRandomWallpaper.metainfo.xml

      - name: Validate Flatpak manifest JSON
        run: |
          python3 -c '
          import json
          appid = "io.github.jermowery.CosmicExtAppletRandomWallpaper"
          with open(f"flatpak/{appid}.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)
          actual_id = manifest.get("id")
          assert actual_id == appid, f"Expected {appid}, got {actual_id}"
          assert manifest["runtime"] == "org.freedesktop.Platform"
          assert manifest["sdk"] == "org.freedesktop.Sdk"
          assert manifest["command"] == "cosmic-ext-applet-random-wallpaper"
          print("Flatpak manifest JSON valid.")
          '
