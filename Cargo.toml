[package]
name = "cosmic-ext-applet-random-wallpaper"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A random wallpaper panel applet for the COSMIC™ desktop, powered by the Unsplash API."
repository = "https://github.com/jermowery/cosmic-unsplash-wallpaper-changer"

[dependencies]
dirs = "6"
i18n-embed-fl = "0.10"
ron = "0.12"
rust-embed = "8.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }
url = "2"

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "tokio", "wayland"]

[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

