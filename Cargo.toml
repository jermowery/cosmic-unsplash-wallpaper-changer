[package]
name = "cosmic-applet-unsplash"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A COSMIC desktop panel applet that fetches and sets wallpapers from Unsplash."
repository = "https://github.com/jermowery/cosmic-unsplash-wallpaper-changer"

[dependencies]
dirs = "6"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }
url = "2"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "tokio", "wayland"]

[patch.crates-io]
proc-macro-error2 = { path = "patches/proc-macro-error2" }

